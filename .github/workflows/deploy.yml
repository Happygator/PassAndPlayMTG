name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Syncs cube lists from Moxfield (falls back to the committed cubes/*.txt
      # if Moxfield is unreachable) and downloads card data/images from Scryfall.
      - run: npm run cube
      # Raw MTGJSON set files are big and change only when a set is printed, so
      # they are cached across runs. The key is stable, so the cache is written
      # once and merely restored afterwards; a set released since then is the
      # only thing boosters:sync has to fetch.
      - name: Restore MTGJSON set files
        uses: actions/cache@v4
        with:
          path: web/.mtgjson-cache
          key: mtgjson-${{ runner.os }}-${{ hashFiles('web/scripts/build-boosters.mjs') }}
          restore-keys: |
            mtgjson-${{ runner.os }}-
      # Rebuilds the gitignored boosters/ collation data. Without this step the
      # build fails: `npm run boosters` (inside prebuild) has nothing to emit.
      - run: npm run boosters:sync
      - run: npm run icons
      - run: npm run build
        env:
          VITE_BASE: /PassAndPlayMTG/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
