name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # The banlist is scraped, the booster sets come from MTGJSON and the card
  # catalogue from Scryfall, all at build time -- so a deploy is how this data
  # refreshes. Weekly keeps a newly printed set or a banlist change landing
  # without anyone pushing. NOTE: GitHub disables scheduled workflows in a repo
  # with no activity for 60 days; re-enable it in the Actions tab if that fires.
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Syncs cube lists from Moxfield (falls back to the committed cubes/*.txt
      # if Moxfield is unreachable) and downloads card data/images from Scryfall.
      - run: npm run cube
      # Raw MTGJSON set files are big and change only when a set is printed, so
      # they are cached across runs. The key is stable, so the cache is written
      # once and merely restored afterwards; a set released since then is the
      # only thing boosters:sync has to fetch.
      - name: Restore MTGJSON set files
        uses: actions/cache@v4
        with:
          path: web/.mtgjson-cache
          key: mtgjson-${{ runner.os }}-${{ hashFiles('web/scripts/build-boosters.mjs') }}
          restore-keys: |
            mtgjson-${{ runner.os }}-
      # Rebuilds the gitignored boosters/ collation data. Without this step the
      # build fails: `npm run boosters` (inside prebuild) has nothing to emit.
      - run: npm run boosters:sync
      - run: npm run icons
      - run: npm run build
        env:
          VITE_BASE: /PassAndPlayMTG/
      # One vite.config.ts serves all three channels, so a mistake there breaks
      # the native bundles silently unless CI builds them too. `npm run build`
      # already ran `generate` and `tsc --noEmit` and the three channels share
      # one source tree, so these skip straight to bundling. Only web/dist is
      # uploaded to Pages; these two exist to fail the build, not to ship.
      - name: Build the app and iMessage channels
        run: |
          npx vite build --mode app
          npx vite build --mode imessage
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
